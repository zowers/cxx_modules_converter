[project]
name = "cxx-modules-converter"
version = "0.1.17"
description = "Convert C++20 modules to headers and headers to modules"
authors = [
    {name = "Alexander Petrov", email = "zowers@zowers.net"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cxx_modules_converter = "cxx_modules_converter:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^26.3.1"
isort = "^8.0.1"
flake8 = "^7.3.0"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
skip-string-normalization = true
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503, F541"
exclude = ".git,__pycache__,build,dist,.venv"
